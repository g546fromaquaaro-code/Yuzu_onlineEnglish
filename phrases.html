<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>100フレーズ一覧 | English Talk Quest</title>
<style>
:root{--ink:#24324a;--muted:#6f7c91;--primary:#6c63ff;--shadow:0 18px 50px rgba(70,80,120,.14)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:var(--ink);background:linear-gradient(135deg,#fff7d6,#dff7ff);min-height:100vh}.app{max-width:900px;margin:auto;padding:20px 16px 50px}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}h1{margin:0;font-size:clamp(26px,5vw,38px)}.back{text-decoration:none;background:white;color:#5148c7;border-radius:14px;padding:10px 14px;font-weight:900;box-shadow:var(--shadow)}.note{color:var(--muted);margin:6px 0 18px}.categoryGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:22px}.catBtn{border:0;border-radius:18px;background:#fff;padding:14px 15px;font-weight:900;font-size:15px;color:var(--ink);cursor:pointer;box-shadow:0 7px 18px rgba(70,80,120,.10);text-align:left}.catBtn.active{background:linear-gradient(135deg,#6c63ff,#8c7cff);color:white}.section{display:none;background:rgba(255,255,255,.86);border-radius:26px;padding:18px;box-shadow:var(--shadow)}.section.show{display:block}.section h2{margin:0 0 14px;font-size:24px}.card{background:#fff;border:1px solid #e8ebf3;border-radius:18px;padding:14px 15px;margin:10px 0}.q{font-size:18px;font-weight:950;margin-bottom:7px}.a{font-size:17px;font-weight:800;color:#4f5a73;margin-bottom:5px}.jp{font-size:13px;color:var(--muted)}.listen{border:0;border-radius:12px;background:#eef0ff;color:#5148c7;padding:9px 12px;font-weight:900;margin-top:9px;cursor:pointer}@media(min-width:720px){.categoryGrid{grid-template-columns:repeat(5,1fr)}}
</style></head><body><div class="app"><div class="header"><div><h1>📚 100フレーズ一覧</h1><div class="note">カテゴリーを選んで、10フレーズずつ確認できます。</div></div><a class="back" href="index.html">← 練習へ</a></div><div id="categoryGrid" class="categoryGrid"></div><div id="sections"></div></div><script>
const stages=[
{icon:'😊',name:'あいさつ',items:[['Hello!','Hello!','こんにちは！'],['Good morning!','Good morning!','おはよう！'],['How are you?','I\'m great!','元気だよ！'],['Nice to meet you.','Nice to meet you, too.','こちらこそ、よろしく！'],['How is your day?','It\'s good!','いい一日だよ！'],['Are you ready?','Yes, I\'m ready!','うん、準備できたよ！'],['How are you today?','I\'m fine, thank you.','元気です、ありがとう。'],['See you tomorrow!','See you!','またね！'],['Have a nice day!','Thank you! You too.','ありがとう！あなたもね。'],['Goodbye!','Bye!','バイバイ！']]},
{icon:'🏫',name:'学校',items:[['Do you like school?','Yes, I do.','うん、好き！'],['What subject do you like?','I like math.','算数が好き。'],['Do you like English?','Yes, I do!','うん、好き！'],['What do you study today?','I study science.','今日は理科を勉強するよ。'],['Do you have homework?','Yes, I do.','うん、あるよ。'],['Is math easy?','Yes, it is.','うん、簡単だよ。'],['Is English difficult?','A little.','少しね。'],['Who is your teacher?','My teacher is Ms. Sato.','先生は佐藤先生だよ。'],['Do you read books?','Yes, I do.','うん、読むよ。'],['Is school fun?','Yes, it\'s fun!','うん、楽しい！']]},
{icon:'🏀',name:'スポーツ',items:[['What sport do you like?','I like basketball.','バスケットボールが好き。'],['Can you play basketball?','Yes, I can!','うん、できるよ！'],['Do you practice every day?','Yes, I do.','うん、毎日するよ。'],['Can you run fast?','Yes, I can.','うん、速く走れるよ。'],['Do you like soccer?','Yes, I do.','うん、好き。'],['What is your favorite sport?','Basketball is my favorite.','バスケが一番好き。'],['Do you play with your friends?','Yes, I do.','うん、友だちとするよ。'],['Was the game fun?','Yes, it was!','うん、楽しかった！'],['Did you win?','Yes, we did!','うん、勝ったよ！'],['Do you want to play?','Yes! Let\'s play!','うん！やろう！']]},
{icon:'🍕',name:'食べ物',items:[['What food do you like?','I like pizza.','ピザが好き。'],['Are you hungry?','Yes, I am.','うん、おなかすいた。'],['What do you want to eat?','I want to eat sushi.','お寿司が食べたい。'],['Do you like chicken?','Yes, I do.','うん、好き。'],['Do you like vegetables?','A little.','少しね。'],['What is your favorite fruit?','I like strawberries.','いちごが好き。'],['Is it delicious?','Yes, it\'s delicious!','うん、おいしい！'],['Do you eat breakfast?','Yes, I do.','うん、食べるよ。'],['What did you eat today?','I ate rice.','ごはんを食べたよ。'],['Are you thirsty?','Yes, I am.','うん、のどがかわいた。']]},
{icon:'👨‍👩‍👧',name:'家族',items:[['Do you have a sister?','Yes, I do.','うん、いるよ。'],['Do you have a brother?','No, I don\'t.','いいえ、いないよ。'],['How many people are in your family?','There are four people.','4人家族だよ。'],['Do you have a pet?','No, I don\'t.','いいえ、飼ってないよ。'],['Does your family like sports?','Yes, we do.','うん、好きだよ。'],['Who cooks dinner?','My mother does.','お母さんだよ。'],['Do you play with your family?','Yes, I do.','うん、一緒に遊ぶよ。'],['Is your family funny?','Yes, very funny!','うん、とてもおもしろい！'],['Do you watch TV together?','Yes, we do.','うん、一緒に見るよ。'],['Do you love your family?','Yes, I do!','うん、大好き！']]},
{icon:'🎮',name:'好きなこと',items:[['What do you like to do?','I like playing games.','ゲームが好き。'],['Do you like drawing?','Yes, I do.','うん、好き。'],['Do you watch YouTube?','Yes, I do.','うん、見るよ。'],['What game do you like?','I like puzzle games.','パズルゲームが好き。'],['Do you like music?','Yes, I do.','うん、好き。'],['Can you sing?','A little.','少しだけ。'],['Do you like dancing?','Yes, I do.','うん、好き。'],['What is your hobby?','My hobby is drawing.','趣味は絵を描くこと。'],['Do you read manga?','Yes, I do.','うん、読むよ。'],['Is it fun?','Yes, it\'s really fun!','うん、すごく楽しい！']]},
{icon:'🌤️',name:'天気',items:[['How is the weather?','It\'s sunny.','晴れだよ。'],['Is it hot today?','Yes, it is.','うん、暑いよ。'],['Is it raining?','No, it isn\'t.','いいえ、降ってないよ。'],['Do you like sunny days?','Yes, I do.','うん、好き。'],['Do you like snow?','Yes, I do.','うん、好き。'],['Is it cold outside?','Yes, it is.','うん、寒いよ。'],['What weather do you like?','I like sunny weather.','晴れが好き。'],['Do you need an umbrella?','Yes, I do.','うん、必要。'],['Is it windy?','A little.','少しね。'],['Is the weather nice?','Yes, it is!','うん、いい天気！']]},
{icon:'⏰',name:'毎日のこと',items:[['What time do you get up?','I get up at six thirty.','6時30分に起きるよ。'],['Do you eat breakfast?','Yes, I do.','うん、食べるよ。'],['What time do you go to school?','I go at eight.','8時に行くよ。'],['What do you do after school?','I play basketball.','バスケをするよ。'],['Do you do your homework?','Yes, I do.','うん、するよ。'],['What time do you eat dinner?','I eat at seven.','7時に食べるよ。'],['Do you take a bath?','Yes, I do.','うん、入るよ。'],['What time do you go to bed?','I go to bed at ten.','10時に寝るよ。'],['Are you sleepy?','A little.','少し眠い。'],['Was your day fun?','Yes, it was!','うん、楽しかった！']]},
{icon:'💬',name:'リアクション',items:[['I got a new game!','Really? That\'s cool!','ほんと？すごい！'],['I won the game!','That\'s amazing!','すごい！'],['I\'m tired.','Are you okay?','大丈夫？'],['I\'m hungry.','Me too!','私も！'],['I like cats.','Me too!','私も！'],['This is difficult.','You can do it!','できるよ！'],['I made this.','Wow! Nice!','わあ！いいね！'],['I don\'t know.','That\'s okay.','大丈夫だよ。'],['I\'m excited!','Me too!','私もワクワクしてる！'],['Thank you!','You\'re welcome!','どういたしまして！']]},
{icon:'🌟',name:'チャレンジ',items:[['What did you do today?','I played basketball.','今日はバスケをしたよ。'],['What do you want to do tomorrow?','I want to play with my friends.','友だちと遊びたい。'],['What is your favorite food?','My favorite food is sushi.','一番好きな食べ物は寿司。'],['Why do you like basketball?','Because it\'s fun.','楽しいから。'],['What are you good at?','I\'m good at running.','走るのが得意。'],['What do you want to be?','I want to be a teacher.','先生になりたい。'],['What makes you happy?','Playing basketball makes me happy.','バスケをすると楽しい。'],['What did you learn today?','I learned English.','英語を勉強したよ。'],['What do you want to try?','I want to try cooking.','料理をやってみたい。'],['How was your day?','It was great!','とてもよかった！']]}
];
function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();speechSynthesis.resume();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.9;u.volume=1;const voices=speechSynthesis.getVoices();const v=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang&&v.lang.startsWith('en'));if(v)u.voice=v;speechSynthesis.speak(u)}
function openCategory(i){document.querySelectorAll('.section').forEach((el,j)=>el.classList.toggle('show',i===j));document.querySelectorAll('.catBtn').forEach((el,j)=>el.classList.toggle('active',i===j));window.scrollTo({top:0,behavior:'smooth'})}
function build(){const grid=document.getElementById('categoryGrid'),sections=document.getElementById('sections');stages.forEach((s,si)=>{const b=document.createElement('button');b.className='catBtn'+(si===0?' active':'');b.textContent=`${s.icon} ${s.name}`;b.onclick=()=>openCategory(si);grid.appendChild(b);const sec=document.createElement('section');sec.className='section'+(si===0?' show':'');sec.innerHTML=`<h2>${s.icon} ${s.name}</h2>`;s.items.forEach((item,ii)=>{const c=document.createElement('div');c.className='card';c.innerHTML=`<div class="q">${ii+1}. ${item[0]}</div><div class="a">→ ${item[1]}</div><div class="jp">${item[2]}</div><button class="listen">🔊 質問を聞く</button>`;c.querySelector('.listen').onclick=()=>speak(item[0]);sec.appendChild(c)});sections.appendChild(sec)})}build();
</script></body></html>
