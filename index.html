<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>English Talk Quest</title>
<style>
  :root{--bg1:#fff7d6;--bg2:#dff7ff;--ink:#24324a;--muted:#6f7c91;--primary:#6c63ff;--orange:#ff9f43;--shadow:0 18px 50px rgba(70,80,120,.16)}
  *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 10%,#fff3a8 0 12%,transparent 13%),radial-gradient(circle at 90% 15%,#c9f1ff 0 14%,transparent 15%),linear-gradient(135deg,var(--bg1),var(--bg2));min-height:100vh}.app{max-width:980px;margin:auto;padding:20px 16px 42px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:30px;background:linear-gradient(135deg,#786cff,#ff7eba);box-shadow:var(--shadow)}h1{font-size:clamp(24px,5vw,38px);margin:0;letter-spacing:-.04em}.subtitle{color:var(--muted);font-size:14px}.xpbox{background:#fff;border-radius:18px;padding:10px 14px;box-shadow:var(--shadow);min-width:128px;text-align:center;font-weight:800}.progressWrap{background:rgba(255,255,255,.72);border-radius:18px;padding:12px 14px;margin-bottom:18px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.progress{margin-top:8px;height:13px;background:#e8ecf5;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#2fcf93,#5ee1b2);transition:.35s}.grid{display:grid;grid-template-columns:250px 1fr;gap:18px}.side,.main{background:rgba(255,255,255,.86);backdrop-filter:blur(8px);border-radius:28px;box-shadow:var(--shadow)}.side{padding:16px}.stageBtn{width:100%;border:0;background:#f4f5fb;color:var(--ink);padding:12px;border-radius:16px;margin:5px 0;text-align:left;font-weight:800;cursor:pointer;display:flex;justify-content:space-between}.stageBtn.active{background:linear-gradient(135deg,#6c63ff,#8c7cff);color:white}.main{padding:clamp(18px,4vw,34px)}.sceneTag{display:inline-flex;background:#fff1f8;color:#c43e80;border-radius:99px;padding:7px 11px;font-weight:800;font-size:13px}.teacher{display:flex;align-items:flex-start;gap:14px;margin:24px 0 18px}.avatar{width:72px;height:72px;border-radius:24px;background:linear-gradient(135deg,#ffd66b,#ff9f6e);display:grid;place-items:center;font-size:40px}.speech{background:#f6f7fb;border-radius:20px 20px 20px 6px;padding:18px 20px;font-size:clamp(23px,4vw,34px);font-weight:900;min-height:78px;display:flex;align-items:center}.listenRow{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 20px 86px}button.action{border:0;border-radius:16px;padding:13px 16px;font-weight:900;font-size:15px;cursor:pointer;color:white}.listen{background:var(--primary)}.slow{background:var(--orange)}.hint{background:#7282a4}.answerArea{background:#f8fbff;border:2px dashed #cdd9ea;border-radius:22px;padding:18px}.answerTitle{font-weight:900;margin-bottom:10px}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{border:2px solid #e3e7f2;border-radius:16px;background:#fff;padding:14px;font-size:18px;font-weight:850;cursor:pointer;text-align:left}.option.correct{background:#ddfff1;border-color:#2fcf93;color:#187d5d}.option.wrong{background:#fff0f0;border-color:#ff7b7b;color:#b34242}.feedback{margin-top:14px;border-radius:18px;padding:14px 16px;display:none;font-weight:800}.feedback.good{display:block;background:#e3fff4;color:#17745a}.feedback.bad{display:block;background:#fff1f1;color:#a13a3a}.modelAnswer{display:none;margin-top:14px;background:#fff7df;border-radius:18px;padding:16px}.modelAnswer.show{display:block}.modelEnglish{font-size:26px;font-weight:950;margin-top:5px}.next{margin-top:18px;width:100%;background:linear-gradient(135deg,#2fcf93,#28b8b0);font-size:18px!important;padding:15px!important;display:none}.next.show{display:block}.small{font-size:13px;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}.side{display:none}.listenRow{margin-left:0}.options{grid-template-columns:1fr}.avatar{width:58px;height:58px;font-size:32px}.speech{font-size:25px}}
</style>
</head>
<body>
<div class="app">
<div class="topbar"><div class="brand"><div class="logo">🎧</div><div><h1>English Talk Quest</h1><div class="subtitle">聞いて、答えて、英会話をレベルアップ！</div></div></div><div class="xpbox">⭐ <span id="xp">0</span> XP</div></div>
<div class="progressWrap"><div class="row"><strong>今日のチャレンジ</strong><span class="small"><span id="doneCount">0</span> / 10</span></div><div class="progress"><div class="bar" id="bar"></div></div></div>
<div class="grid"><aside class="side"><h2>🗺️ ステージ</h2><div id="stageList"></div></aside><main class="main"><span class="sceneTag" id="sceneTag">😊 あいさつ</span><div class="teacher"><div class="avatar">👩‍🏫</div><div><div class="small">Teacher</div><div class="speech" id="question">Hello!</div></div></div><div class="listenRow"><button class="action listen" onclick="speakQuestion()">🔊 聞く</button><button class="action slow" onclick="speakQuestion(0.72)">🐢 ゆっくり</button><button class="action hint" onclick="showHint()">💡 ヒント</button></div><section class="answerArea"><div class="answerTitle">どう答える？</div><div class="options" id="options"></div><div id="feedback" class="feedback"></div><div id="modelAnswer" class="modelAnswer"><div class="small">こんなふうに答えよう</div><div class="modelEnglish" id="modelEnglish"></div><button class="action listen" style="margin-top:10px" onclick="speakAnswer()">🔊 お手本を聞く</button></div></section><button id="nextBtn" class="action next" onclick="nextQuestion()">次の会話へ ➜</button></main></div></div>
<script>
const stages=[
{icon:'😊',name:'あいさつ',items:[['Hello!','Hello!','こんにちは！'],['Good morning!','Good morning!','おはよう！'],['How are you?','I\'m great!','元気だよ！'],['Nice to meet you.','Nice to meet you, too.','こちらこそ、よろしく！'],['How is your day?','It\'s good!','いい一日だよ！'],['Are you ready?','Yes, I\'m ready!','うん、準備できたよ！'],['How are you today?','I\'m fine, thank you.','元気です、ありがとう。'],['See you tomorrow!','See you!','またね！'],['Have a nice day!','Thank you! You too.','ありがとう！あなたもね。'],['Goodbye!','Bye!','バイバイ！']]},
{icon:'🏫',name:'学校',items:[['Do you like school?','Yes, I do.','うん、好き！'],['What subject do you like?','I like math.','算数が好き。'],['Do you like English?','Yes, I do!','うん、好き！'],['What do you study today?','I study science.','今日は理科を勉強するよ。'],['Do you have homework?','Yes, I do.','うん、あるよ。'],['Is math easy?','Yes, it is.','うん、簡単だよ。'],['Is English difficult?','A little.','少しね。'],['Who is your teacher?','My teacher is Ms. Sato.','先生は佐藤先生だよ。'],['Do you read books?','Yes, I do.','うん、読むよ。'],['Is school fun?','Yes, it\'s fun!','うん、楽しい！']]},
{icon:'🏀',name:'スポーツ',items:[['What sport do you like?','I like basketball.','バスケットボールが好き。'],['Can you play basketball?','Yes, I can!','うん、できるよ！'],['Do you practice every day?','Yes, I do.','うん、毎日するよ。'],['Can you run fast?','Yes, I can.','うん、速く走れるよ。'],['Do you like soccer?','Yes, I do.','うん、好き。'],['What is your favorite sport?','Basketball is my favorite.','バスケが一番好き。'],['Do you play with your friends?','Yes, I do.','うん、友だちとするよ。'],['Was the game fun?','Yes, it was!','うん、楽しかった！'],['Did you win?','Yes, we did!','うん、勝ったよ！'],['Do you want to play?','Yes! Let\'s play!','うん！やろう！']]},
{icon:'🍕',name:'食べ物',items:[['What food do you like?','I like pizza.','ピザが好き。'],['Are you hungry?','Yes, I am.','うん、おなかすいた。'],['What do you want to eat?','I want to eat sushi.','お寿司が食べたい。'],['Do you like chicken?','Yes, I do.','うん、好き。'],['Do you like vegetables?','A little.','少しね。'],['What is your favorite fruit?','I like strawberries.','いちごが好き。'],['Is it delicious?','Yes, it\'s delicious!','うん、おいしい！'],['Do you eat breakfast?','Yes, I do.','うん、食べるよ。'],['What did you eat today?','I ate rice.','ごはんを食べたよ。'],['Are you thirsty?','Yes, I am.','うん、のどがかわいた。']]},
{icon:'👨‍👩‍👧',name:'家族',items:[['Do you have a sister?','Yes, I do.','うん、いるよ。'],['Do you have a brother?','No, I don\'t.','いいえ、いないよ。'],['How many people are in your family?','There are four people.','4人家族だよ。'],['Do you have a pet?','No, I don\'t.','いいえ、飼ってないよ。'],['Does your family like sports?','Yes, we do.','うん、好きだよ。'],['Who cooks dinner?','My mother does.','お母さんだよ。'],['Do you play with your family?','Yes, I do.','うん、一緒に遊ぶよ。'],['Is your family funny?','Yes, very funny!','うん、とてもおもしろい！'],['Do you watch TV together?','Yes, we do.','うん、一緒に見るよ。'],['Do you love your family?','Yes, I do!','うん、大好き！']]},
{icon:'🎮',name:'好きなこと',items:[['What do you like to do?','I like playing games.','ゲームが好き。'],['Do you like drawing?','Yes, I do.','うん、好き。'],['Do you watch YouTube?','Yes, I do.','うん、見るよ。'],['What game do you like?','I like puzzle games.','パズルゲームが好き。'],['Do you like music?','Yes, I do.','うん、好き。'],['Can you sing?','A little.','少しだけ。'],['Do you like dancing?','Yes, I do.','うん、好き。'],['What is your hobby?','My hobby is drawing.','趣味は絵を描くこと。'],['Do you read manga?','Yes, I do.','うん、読むよ。'],['Is it fun?','Yes, it\'s really fun!','うん、すごく楽しい！']]},
{icon:'🌤️',name:'天気',items:[['How is the weather?','It\'s sunny.','晴れだよ。'],['Is it hot today?','Yes, it is.','うん、暑いよ。'],['Is it raining?','No, it isn\'t.','いいえ、降ってないよ。'],['Do you like sunny days?','Yes, I do.','うん、好き。'],['Do you like snow?','Yes, I do.','うん、好き。'],['Is it cold outside?','Yes, it is.','うん、寒いよ。'],['What weather do you like?','I like sunny weather.','晴れが好き。'],['Do you need an umbrella?','Yes, I do.','うん、必要。'],['Is it windy?','A little.','少しね。'],['Is the weather nice?','Yes, it is!','うん、いい天気！']]},
{icon:'⏰',name:'毎日のこと',items:[['What time do you get up?','I get up at six thirty.','6時30分に起きるよ。'],['Do you eat breakfast?','Yes, I do.','うん、食べるよ。'],['What time do you go to school?','I go at eight.','8時に行くよ。'],['What do you do after school?','I play basketball.','バスケをするよ。'],['Do you do your homework?','Yes, I do.','うん、するよ。'],['What time do you eat dinner?','I eat at seven.','7時に食べるよ。'],['Do you take a bath?','Yes, I do.','うん、入るよ。'],['What time do you go to bed?','I go to bed at ten.','10時に寝るよ。'],['Are you sleepy?','A little.','少し眠い。'],['Was your day fun?','Yes, it was!','うん、楽しかった！']]},
{icon:'💬',name:'リアクション',items:[['I got a new game!','Really? That\'s cool!','ほんと？すごい！'],['I won the game!','That\'s amazing!','すごい！'],['I\'m tired.','Are you okay?','大丈夫？'],['I\'m hungry.','Me too!','私も！'],['I like cats.','Me too!','私も！'],['This is difficult.','You can do it!','できるよ！'],['I made this.','Wow! Nice!','わあ！いいね！'],['I don\'t know.','That\'s okay.','大丈夫だよ。'],['I\'m excited!','Me too!','私もワクワクしてる！'],['Thank you!','You\'re welcome!','どういたしまして！']]},
{icon:'🌟',name:'チャレンジ',items:[['What did you do today?','I played basketball.','今日はバスケをしたよ。'],['What do you want to do tomorrow?','I want to play with my friends.','友だちと遊びたい。'],['What is your favorite food?','My favorite food is sushi.','一番好きな食べ物は寿司。'],['Why do you like basketball?','Because it\'s fun.','楽しいから。'],['What are you good at?','I\'m good at running.','走るのが得意。'],['What do you want to be?','I want to be a teacher.','先生になりたい。'],['What makes you happy?','Playing basketball makes me happy.','バスケをすると楽しい。'],['What did you learn today?','I learned English.','英語を勉強したよ。'],['What do you want to try?','I want to try cooking.','料理をやってみたい。'],['How was your day?','It was great!','とてもよかった！']]}
];
let stage=0,index=0,xp=0,completed=0,answered=false;
function buildStageList(){const box=document.getElementById('stageList');box.innerHTML='';stages.forEach((s,i)=>{const b=document.createElement('button');b.className='stageBtn'+(i===stage?' active':'');b.innerHTML=`<span>${s.icon} ${i+1}. ${s.name}</span><span>10</span>`;b.onclick=()=>{stage=i;index=0;render();buildStageList()};box.appendChild(b)})}
function makeOptions(correct){let pool=[];stages.forEach(s=>s.items.forEach(x=>pool.push(x[1])));pool=pool.filter(x=>x!==correct).sort(()=>Math.random()-.5);const opts=[correct,...pool.slice(0,3)].sort(()=>Math.random()-.5);const box=document.getElementById('options');box.innerHTML='';opts.forEach(text=>{const b=document.createElement('button');b.className='option';b.textContent=text;b.onclick=()=>checkAnswer(b,text,correct);box.appendChild(b)})}
function render(){const s=stages[stage],item=s.items[index];sceneTag.textContent=`${s.icon} ${s.name}`;question.textContent=item[0];modelEnglish.textContent=item[1];feedback.className='feedback';modelAnswer.className='modelAnswer';nextBtn.className='action next';makeOptions(item[1]);answered=false}
function checkAnswer(btn,selected,correct){if(answered)return;answered=true;document.querySelectorAll('.option').forEach(b=>{if(b.textContent===correct)b.classList.add('correct')});if(selected===correct){btn.classList.add('correct');feedback.className='feedback good';feedback.textContent='🎉 Great! 正解！ +10 XP';xp+=10}else{btn.classList.add('wrong');feedback.className='feedback bad';feedback.textContent='😊 Nice try! 正解を聞いてまねしてみよう。'}completed=Math.min(completed+1,10);updateProgress();modelAnswer.className='modelAnswer show';nextBtn.className='action next show';document.getElementById('xp').textContent=xp}
function nextQuestion(){index++;if(index>=stages[stage].items.length){stage=(stage+1)%stages.length;index=0;completed=0}buildStageList();render()}
function updateProgress(){doneCount.textContent=completed;bar.style.width=(completed*10)+'%'}
function showHint(){alert('💡 ヒント\n\n'+stages[stage].items[index][2])}
function speak(text,rate=.92){if(!('speechSynthesis'in window)){alert('音声読み上げに対応していません。Safariで開いてください。');return}try{speechSynthesis.cancel();speechSynthesis.resume();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;u.volume=1;const voices=speechSynthesis.getVoices();const v=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang&&v.lang.startsWith('en'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){alert('音声を再生できませんでした。Safariで開いて試してください。')}}
function speakQuestion(rate=.92){speak(stages[stage].items[index][0],rate)}function speakAnswer(){speak(stages[stage].items[index][1],.88)}buildStageList();render();updateProgress();
</script></body></html>
