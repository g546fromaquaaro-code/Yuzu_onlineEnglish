<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>English Talk Quest</title><style>:root{--p:#6c63ff;--o:#ff9f43;--ink:#24324a;--mut:#6f7c91}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;color:var(--ink);background:linear-gradient(135deg,#fff7d6,#dff7ff);min-height:100vh}.app{max-width:900px;margin:auto;padding:18px}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.lv{border:0;border-radius:18px;padding:12px 7px;font-weight:900;background:#eef0f7;color:#536078}.lv.active{background:#7668ff;color:white}.cats{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}.cat{white-space:nowrap;border:0;border-radius:14px;padding:10px 12px;background:white;font-weight:850}.cat.active{background:var(--p);color:white}.card{background:#fff;border-radius:24px;padding:18px}.tag{display:inline-block;background:#fff1f8;color:#c43e80;border-radius:99px;padding:7px 11px;font-weight:900}.historyBox{display:none;margin:14px 0;background:#fff;border-radius:18px;padding:14px;border:2px solid #e8ebf3}.historyBox.show{display:block}.hrow{display:flex;margin:8px 0}.hrow.you{justify-content:flex-end}.hb{background:#f5f6fb;border-radius:12px;padding:9px 11px;font-weight:750}.hrow.you .hb{background:#e8fff5}.teacher{margin:18px 0;background:#f5f6fb;border-radius:20px;padding:18px}.who{font-size:13px;color:#6f7c91}.line{font-size:28px;font-weight:950}.btn{border:0;border-radius:15px;padding:12px 14px;color:white;font-weight:900;font-size:15px}.listen{background:#6c63ff}.slow{background:#ff9f43}.reveal{width:100%;margin-top:14px;background:linear-gradient(135deg,#ff9f43,#ff6fae);font-size:18px}.answer{display:none;margin-top:12px;background:#e8fff5;border-radius:18px;padding:16px}.answer.show{display:block}.ans{font-size:25px;font-weight:950}.next{display:none;width:100%;margin-top:12px;background:#2fcf93}.next.show{display:block}.progress{text-align:center;font-weight:850;color:#64708a;margin:12px}</style></head><body><div class="app"><div class="nav"><button id="l1" class="lv active" onclick="setLevel(1)">LEVEL 1<br>答える</button><button id="l2" class="lv" onclick="setLevel(2)">LEVEL 2<br>会話する</button><button id="l3" class="lv" onclick="setLevel(3)">LEVEL 3<br>質問する</button></div><div id="catsEl" class="cats"></div><div class="card"><span id="tagEl" class="tag"></span><div id="progressEl" class="progress"></div><div id="historyEl" class="historyBox"><b>💬 ここまでの会話</b><div id="historyBodyEl"></div></div><div class="teacher"><div class="who">Teacher</div><div id="promptEl" class="line"></div></div><button class="btn listen" onclick="speakPrompt()">🔊 聞く</button> <button class="btn slow" onclick="speakPrompt(.72)">🐢 ゆっくり</button><button id="revealEl" class="btn reveal" onclick="revealAnswer()">👀 タップして答えを見る</button><div id="answerEl" class="answer"><div class="who">You</div><div id="answerTextEl" class="ans"></div><button class="btn listen" onclick="speakAnswer()">🔊 答えを聞く</button></div><div id="askEl" class="answer"><b>🎯 あなたから質問！</b><div id="askJpEl"></div><button class="btn reveal" onclick="revealAsk()">👀 英語を見る</button><div id="askEnEl" class="ans" style="display:none"></div></div><button id="nextEl" class="btn next" onclick="nextStep()">次の会話へ ➜</button></div></div><script>const C=[{i:'😊',n:'あいさつ',talk:[['Hello!','Hello!'],['How are you today?','I am great!'],['Are you ready?','Yes, I am ready!']],ask:['How are you today?','今日は元気ですか？']},{i:'🏫',n:'学校',talk:[['Do you like school?','Yes, I do.'],['What subject do you like?','I like math.'],['Do you have homework?','Yes, I do.']],ask:['What subject do you like?','好きな教科は何ですか？']},{i:'🏀',n:'スポーツ',talk:[['What sport do you like?','I like basketball.'],['Can you play basketball?','Yes, I can!'],['Do you practice every day?','Yes, I do.']],ask:['What sport do you like?','どんなスポーツが好きですか？']},{i:'🍕',n:'食べ物',talk:[['Are you hungry?','Yes, I am.'],['What food do you like?','I like pizza.'],['Is it delicious?','Yes, it is!']],ask:['What food do you like?','どんな食べ物が好きですか？']},{i:'🌤️',n:'天気',talk:[['Hello!','Hello!'],['How is the weather today?','It is sunny today.'],['Is it hot today?','Yes, it is.']],ask:['How is the weather there?','あなたのところの天気はどうですか？']}];let lv=1,cat=0,step=0;const E=id=>document.getElementById(id);function buildCats(){E('catsEl').innerHTML=C.map((c,i)=>`<button class="cat ${i===cat?'active':''}" onclick="setCat(${i})">${c.i} ${c.n}</button>`).join('')}function setLevel(n){lv=n;step=0;[1,2,3].forEach(x=>E('l'+x).classList.toggle('active',x===n));render()}function setCat(i){cat=i;step=0;render()}function renderHistory(){let box=E('historyEl'),body=E('historyBodyEl');if(lv===1||step===0){box.classList.remove('show');body.innerHTML='';return}let h='';for(let i=0;i<Math.min(step,C[cat].talk.length);i++){h+=`<div class="hrow"><div class="hb">👩‍🏫 ${C[cat].talk[i][0]}</div></div><div class="hrow you"><div class="hb">${C[cat].talk[i][1]} 🙂</div></div>`}body.innerHTML=h;box.classList.add('show')}function render(){let c=C[cat];buildCats();E('tagEl').textContent=c.i+' '+c.n;E('answerEl').classList.remove('show');E('askEl').classList.remove('show');E('nextEl').classList.remove('show');E('revealEl').style.display='block';let s=Math.min(step,c.talk.length-1);E('progressEl').textContent=`LEVEL ${lv} ・ 会話 ${s+1}/${c.talk.length}`;E('promptEl').textContent=c.talk[s][0];E('answerTextEl').textContent=c.talk[s][1];if(lv===3&&step>=c.talk.length){E('progressEl').textContent='LEVEL 3 ・ あなたから質問';E('promptEl').textContent='自分から先生に質問してみよう！';E('revealEl').style.display='none';E('askEl').classList.add('show');E('askJpEl').textContent=c.ask[1];E('askEnEl').textContent=c.ask[0];E('askEnEl').style.display='none';E('nextEl').classList.add('show')}renderHistory()}function revealAnswer(){E('answerEl').classList.add('show');E('revealEl').style.display='none';E('nextEl').classList.add('show')}function nextStep(){if(lv===3&&step>=C[cat].talk.length){step=0}else{step++;if(lv!==3&&step>=C[cat].talk.length)step=0}render()}function revealAsk(){E('askEnEl').style.display='block'}function speak(t,r=.9){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=r;speechSynthesis.speak(u)}function speakPrompt(r=.9){let c=C[cat],s=Math.min(step,c.talk.length-1);speak(c.talk[s][0],r)}function speakAnswer(){let c=C[cat],s=Math.min(step,c.talk.length-1);speak(c.talk[s][1])}render();</script></body></html>
