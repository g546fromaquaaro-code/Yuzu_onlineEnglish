<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Talk Quest</title>
<style>
:root{--p:#6c63ff;--g:#2fcf93;--o:#ff9f43;--ink:#24324a;--mut:#6f7c91}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;color:var(--ink);background:linear-gradient(135deg,#fff7d6,#dff7ff);min-height:100vh}
.app{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{display:flex;align-items:center;gap:10px}.logo{font-size:30px}h1{font-size:clamp(24px,5vw,36px);margin:0}.small{font-size:13px;color:var(--mut)}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.lv{border:0;border-radius:18px;padding:12px 7px;font-weight:900;background:#eef0f7;color:#536078}.lv.active{background:linear-gradient(135deg,#6c63ff,#8c7cff);color:white}
.cats{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}.cat{white-space:nowrap;border:0;border-radius:14px;padding:10px 12px;background:white;font-weight:850}.cat.active{background:var(--p);color:white}
.card{background:rgba(255,255,255,.92);border-radius:24px;padding:18px;box-shadow:0 14px 35px rgba(70,80,120,.13)}.tag{display:inline-block;background:#fff1f8;color:#c43e80;border-radius:99px;padding:7px 11px;font-weight:900}
.history{display:none;margin:14px 0;background:#fff;border-radius:18px;padding:14px;border:1px solid #e8ebf3}.history.show{display:block}.summaryBox{display:none;margin-top:14px;background:#fff7df;border:2px solid #ffd77a;border-radius:20px;padding:16px}.summaryBox.show{display:block}.summaryTitle{font-size:20px;font-weight:950;margin-bottom:10px}.historyTitle{font-weight:900;margin-bottom:9px}.hrow{display:flex;gap:8px;margin:7px 0;align-items:flex-start}.hrow.you{flex-direction:row-reverse}.hav{width:30px;height:30px;border-radius:10px;background:#ffe09a;display:grid;place-items:center;flex:0 0 auto}.hrow.you .hav{background:#dff7ff}.hb{background:#f5f6fb;border-radius:12px;padding:8px 10px;font-weight:750;font-size:15px;max-width:85%}.hrow.you .hb{background:#e8fff5}
.teacher{margin:18px 0;background:#f5f6fb;border-radius:20px;padding:18px}.who{font-size:13px;color:var(--mut);margin-bottom:5px}.line{font-size:clamp(23px,5vw,32px);font-weight:950}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:15px;padding:12px 14px;color:white;font-weight:900;font-size:15px}.listen{background:var(--p)}.slow{background:var(--o)}.reveal{width:100%;margin-top:14px;background:linear-gradient(135deg,#ff9f43,#ff6fae);font-size:18px}.answer{display:none;margin-top:12px;background:#e8fff5;border-radius:18px;padding:16px}.answer.show{display:block}.ans{font-size:25px;font-weight:950}.next{display:none;width:100%;margin-top:12px;background:linear-gradient(135deg,#2fcf93,#28b8b0)}.next.show{display:block}.ask{background:#e9f4ff;border-radius:18px;padding:16px;margin-top:14px}.links{text-align:right;margin:10px 0}.links a{text-decoration:none;color:#5148c7;font-weight:900;background:white;padding:9px 12px;border-radius:13px;display:inline-block}.progressText{text-align:center;font-weight:850;color:#64708a;margin:6px 0 14px}
@media(max-width:600px){.app{padding:14px}.lv{font-size:12px}.card{padding:15px}}
</style></head><body><div class="app">
<div class="top"><div class="brand"><div class="logo">🎧</div><div><h1>English Talk Quest</h1><div class="small">聞く → 答える → 会話する → 質問する</div></div></div></div>
<div class="nav"><button id="l1" class="lv active" onclick="setLevel(1)">LEVEL 1<br><span class="small">答える</span></button><button id="l2" class="lv" onclick="setLevel(2)">LEVEL 2<br><span class="small">会話する</span></button><button id="l3" class="lv" onclick="setLevel(3)">LEVEL 3<br><span class="small">質問する</span></button></div>
<div class="links"><a href="phrases.html">📚 フレーズ一覧</a></div><div id="cats" class="cats"></div>
<div class="card"><span id="tag" class="tag"></span><div id="progressText" class="progressText"></div>
<div id="history" class="history"><div class="historyTitle">💬 ここまでの会話</div><div id="historyBody"></div></div>
<div class="teacher"><div id="who" class="who">Teacher</div><div id="promptText" class="line"></div></div>
<div class="actions"><button class="btn listen" onclick="speakPrompt()">🔊 聞く</button><button class="btn slow" onclick="speakPrompt(.72)">🐢 ゆっくり</button></div>
<button id="revealBtn" class="btn reveal" onclick="revealAnswer()">👀 タップして答えを見る</button>
<div id="answerBox" class="answer"><div class="who">You</div><div id="answerText" class="ans"></div><button class="btn listen" style="margin-top:10px" onclick="speakAnswer()">🔊 答えを聞く</button></div>
<div id="askBox" class="ask" style="display:none"><strong>🎯 あなたから質問！</strong><div id="askJp" style="margin:7px 0"></div><button id="askReveal" class="btn reveal" onclick="revealAsk()">👀 英語を見る</button><div id="askAns" class="answer"><div id="askEn" class="ans"></div><button class="btn listen" style="margin-top:10px" onclick="speakAsk()">🔊 質問を聞く</button></div></div>
<div id="summaryBox" class="summaryBox"><div class="summaryTitle">✅ 今回の会話まとめ</div><div id="summaryBody"></div><button class="btn listen" style="width:100%;margin-top:10px" onclick="playSummary()">▶️ 全部聞く</button></div><button id="nextBtn" class="btn next" onclick="nextStep()">次へ ➜</button></div></div>
<script>
const C=[{"i":"😊","n":"あいさつ","l1":[["Hello!","Hello!","こんにちは"],["Good morning!","Good morning!","おはよう"],["How are you?","I'm great!","元気？"],["Nice to meet you.","Nice to meet you, too.","はじめまして"],["Are you ready?","Yes, I'm ready!","準備できた？"]],"talk":[["Hello!","Hello!"],["How are you today?","I'm great!"],["Are you ready?","Yes, I'm ready!"]],"ask":["How are you today?","今日は元気ですか？"]},{"i":"🏫","n":"学校","l1":[["Do you like school?","Yes, I do.","学校好き？"],["What subject do you like?","I like math.","好きな教科は？"],["Do you like English?","Yes, I do!","英語好き？"],["Do you have homework?","Yes, I do.","宿題ある？"],["Is school fun?","Yes, it is!","学校楽しい？"]],"talk":[["Do you like school?","Yes, I do."],["What subject do you like?","I like math."],["Do you have homework?","Yes, I do."]],"ask":["What subject do you like?","好きな教科は何ですか？"]},{"i":"🏀","n":"スポーツ","l1":[["What sport do you like?","I like basketball.","好きなスポーツは？"],["Can you play basketball?","Yes, I can!","バスケできる？"],["Do you practice every day?","Yes, I do.","毎日練習する？"],["Can you run fast?","Yes, I can.","速く走れる？"],["Was the game fun?","Yes, it was!","試合楽しかった？"]],"talk":[["What sport do you like?","I like basketball."],["Can you play basketball?","Yes, I can!"],["Do you practice every day?","Yes, I do."]],"ask":["What sport do you like?","どんなスポーツが好きですか？"]},{"i":"🍕","n":"食べ物","l1":[["What food do you like?","I like pizza.","好きな食べ物は？"],["Are you hungry?","Yes, I am.","お腹すいた？"],["What do you want to eat?","I want to eat sushi.","何食べたい？"],["Is it delicious?","Yes, it is!","おいしい？"],["Are you thirsty?","Yes, I am.","のどかわいた？"]],"talk":[["Are you hungry?","Yes, I am."],["What food do you like?","I like pizza."],["Is it delicious?","Yes, it is!"]],"ask":["What food do you like?","どんな食べ物が好きですか？"]},{"i":"👨‍👩‍👧","n":"家族","l1":[["Do you have a sister?","Yes, I do.","姉妹いる？"],["Do you have a brother?","No, I don't.","兄弟いる？"],["How many people are in your family?","There are four people.","何人家族？"],["Do you have a pet?","No, I don't.","ペットいる？"],["Do you watch TV together?","Yes, we do.","一緒にテレビ見る？"]],"talk":[["Do you have a sister?","Yes, I do."],["How many people are in your family?","There are four people."],["Do you have a pet?","No, I don't."]],"ask":["Do you have a pet?","ペットを飼っていますか？"]},{"i":"🎮","n":"好きなこと","l1":[["What do you like to do?","I like playing games.","何するの好き？"],["Do you like drawing?","Yes, I do.","絵好き？"],["Do you like music?","Yes, I do.","音楽好き？"],["Can you sing?","A little.","歌える？"],["What is your hobby?","My hobby is drawing.","趣味は？"]],"talk":[["What do you like to do?","I like playing games."],["Do you like music?","Yes, I do."],["What is your hobby?","My hobby is drawing."]],"ask":["What do you like to do?","何をするのが好きですか？"]},{"i":"🌤️","n":"天気","l1":[["How is the weather?","It's sunny.","天気は？"],["Is it hot today?","Yes, it is.","暑い？"],["Is it raining?","No, it isn't.","雨？"],["Is it windy?","A little.","風強い？"],["Is the weather nice?","Yes, it is!","いい天気？"]],"talk":[["Hello!","Hello!"],["How is the weather today?","It's sunny today."],["Is it hot today?","Yes, it is."]],"ask":["How is the weather there?","あなたのところの天気はどうですか？"]},{"i":"⏰","n":"毎日のこと","l1":[["What time do you get up?","I get up at six thirty.","何時に起きる？"],["Do you eat breakfast?","Yes, I do.","朝ごはん食べる？"],["What time do you go to school?","I go at eight.","何時に学校？"],["What do you do after school?","I play basketball.","放課後何する？"],["What time do you go to bed?","I go to bed at ten.","何時に寝る？"]],"talk":[["What time do you get up?","I get up at six thirty."],["Do you eat breakfast?","Yes, I do."],["What time do you go to school?","I go at eight."]],"ask":["What time do you get up?","何時に起きますか？"]},{"i":"💬","n":"リアクション","l1":[["I got a new game!","Really? That's cool!","新しいゲーム買った"],["I won the game!","That's amazing!","勝ったよ"],["I'm tired.","Are you okay?","疲れた"],["I'm hungry.","Me too!","お腹すいた"],["Thank you!","You're welcome!","ありがとう"]],"talk":[["I got a new game!","Really? That's cool!"],["I won the game!","That's amazing!"],["I'm tired.","Are you okay?"]],"ask":["Are you okay?","大丈夫ですか？"]},{"i":"🌟","n":"チャレンジ","l1":[["What did you do today?","I played basketball.","今日は何した？"],["What do you want to do tomorrow?","I want to play with my friends.","明日何したい？"],["What is your favorite food?","My favorite food is sushi.","好きな食べ物は？"],["Why do you like basketball?","Because it's fun.","なぜバスケ好き？"],["How was your day?","It was great!","今日はどうだった？"]],"talk":[["What did you do today?","I played basketball."],["Was it fun?","Yes, it was!"],["What do you want to do tomorrow?","I want to play with my friends."]],"ask":["What did you do today?","今日は何をしましたか？"]}];
let lv=1,cat=0,step=0,l1idx=0,askMode=false,summaryMode=false;
const E=id=>document.getElementById(id);
function buildCats(){E('cats').innerHTML=C.map((c,i)=>`<button class="cat ${i===cat?'active':''}" onclick="setCat(${i})">${c.i} ${c.n}</button>`).join('')}
function setLevel(n){lv=n;step=0;l1idx=0;askMode=false;summaryMode=false;[1,2,3].forEach(x=>document.getElementById('l'+x).classList.toggle('active',x===n));render()}
function setCat(i){cat=i;step=0;l1idx=0;askMode=false;summaryMode=false;render();buildCats()}
function renderHistory(){const historyEl=document.getElementById('history');const historyBodyEl=document.getElementById('historyBody');if(lv===1||step===0){historyEl.className='history';historyBodyEl.innerHTML='';return}const t=C[cat].talk;let h='';const completed=Math.min(step,t.length);for(let i=0;i<completed;i++){h+=`<div class="hrow"><div class="hav">👩‍🏫</div><div class="hb">${t[i][0]}</div></div><div class="hrow you"><div class="hav">🙂</div><div class="hb">${t[i][1]}</div></div>`}if(askMode){h+=`<div class="hrow you"><div class="hav">🙂</div><div class="hb">${C[cat].ask[0]}</div></div>`}historyBodyEl.innerHTML=h;historyEl.className='history show'}
function render(){const c=C[cat];E('tag').textContent=c.i+' '+c.n;E('answerBox').className='answer';E('askBox').style.display='none';E('summaryBox').className='summaryBox';E('nextBtn').className='btn next';E('revealBtn').style.display='block';askMode=false;if(summaryMode){E('progressText').textContent=`LEVEL ${lv} ・ 会話まとめ`;E('who').textContent='Review';E('promptText').textContent='3つの会話を確認しよう！';E('revealBtn').style.display='none';let h='';c.talk.forEach(x=>{h+=`<div class="hrow"><div class="hav">👩‍🏫</div><div class="hb">${x[0]}</div></div><div class="hrow you"><div class="hav">🙂</div><div class="hb">${x[1]}</div></div>`});E('summaryBody').innerHTML=h;E('summaryBox').className='summaryBox show';E('nextBtn').className='btn next show';E('nextBtn').textContent=lv===3?'質問練習へ ➜':'最初から ➜';buildCats();renderHistory();return}if(lv===1){const q=c.l1[l1idx%c.l1.length];E('progressText').textContent=`LEVEL 1 ・ ${l1idx+1}/${c.l1.length}`;E('who').textContent='Teacher';E('promptText').textContent=q[0];E('answerText').textContent=q[1]}else{const t=c.talk;if(step<t.length){E('progressText').textContent=`LEVEL ${lv} ・ 会話 ${step+1}/${t.length}`;E('who').textContent='Teacher';E('promptText').textContent=t[step][0];E('answerText').textContent=t[step][1]}else if(lv===3){askMode=true;E('progressText').textContent='LEVEL 3 ・ あなたから質問';E('who').textContent='Your turn';E('promptText').textContent='自分から先生に質問してみよう！';E('revealBtn').style.display='none';E('askBox').style.display='block';E('askJp').textContent=c.ask[1];E('askEn').textContent=c.ask[0];E('askAns').className='answer';E('askReveal').style.display='block';E('nextBtn').className='btn next show';E('nextBtn').textContent='最初から ➜'}}buildCats();renderHistory()}
function revealAnswer(){E('answerBox').classList.add('show');E('revealBtn').style.display='none';E('nextBtn').classList.add('show');E('nextBtn').textContent=lv===1?'次へ ➜':(step===C[cat].talk.length-1?'会話をまとめて確認 ➜':'次の会話へ ➜')}
function nextStep(){if(lv===1){l1idx=(l1idx+1)%C[cat].l1.length;render();return}if(summaryMode){summaryMode=false;if(lv===3){step=C[cat].talk.length}else{step=0}render();return}if(askMode){step=0;render();return}if(step===C[cat].talk.length-1){summaryMode=true;render();return}step++;render()}
function revealAsk(){E('askAns').classList.add('show');E('askReveal').style.display='none';renderHistory()}
function speak(t,r=.9){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();speechSynthesis.resume();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=r;speechSynthesis.speak(u)}
function speakPrompt(r=.9){const c=C[cat];if(lv===1)speak(c.l1[l1idx%c.l1.length][0],r);else if(step<c.talk.length)speak(c.talk[step][0],r)}
function speakAnswer(){const c=C[cat];if(lv===1)speak(c.l1[l1idx%c.l1.length][1],.86);else if(step<c.talk.length)speak(c.talk[step][1],.86)}
function playSummary(){let lines=[];C[cat].talk.forEach(x=>{lines.push(x[0],x[1])});let i=0;speechSynthesis.cancel();function n(){if(i>=lines.length)return;const u=new SpeechSynthesisUtterance(lines[i++]);u.lang='en-US';u.rate=.86;u.onend=()=>setTimeout(n,250);speechSynthesis.speak(u)}n()}
function speakAsk(){speak(C[cat].ask[0],.86)}
render();
</script></body></html>
