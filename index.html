<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>English Talk Quest</title><style>:root{--p:#6c63ff;--g:#2fcf93;--o:#ff9f43;--ink:#24324a;--mut:#6f7c91}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;color:var(--ink);background:linear-gradient(135deg,#fff7d6,#dff7ff);min-height:100vh}.app{max-width:960px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;gap:10px;align-items:center}.logo{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,#786cff,#ff7eba)}h1{margin:0;font-size:clamp(25px,5vw,38px)}.sub,.small{color:var(--mut);font-size:13px}.xp{background:#fff;padding:10px 14px;border-radius:16px;font-weight:900}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.lv{border:0;border-radius:18px;padding:13px 8px;font-weight:900;background:#eef0f7;color:#536078}.lv.active{background:linear-gradient(135deg,#6c63ff,#8c7cff);color:#fff}.links{display:flex;justify-content:flex-end;margin-bottom:12px}.link{background:#fff;color:#5148c7;text-decoration:none;font-weight:900;padding:10px 13px;border-radius:14px}.grid{display:grid;grid-template-columns:230px 1fr;gap:16px}.side,.main{background:rgba(255,255,255,.9);border-radius:25px;padding:16px;box-shadow:0 15px 40px rgba(70,80,120,.13)}.stage{width:100%;border:0;border-radius:14px;padding:11px;margin:4px 0;background:#f2f4f8;text-align:left;font-weight:850}.stage.active{background:var(--p);color:#fff}.tag{display:inline-block;background:#fff1f8;color:#c43e80;padding:7px 11px;border-radius:99px;font-weight:900}.teacher{display:flex;gap:12px;align-items:flex-start;margin:20px 0}.avatar,.mini{display:grid;place-items:center;background:#ffe09a}.avatar{width:62px;height:62px;border-radius:20px;font-size:34px}.bubble{background:#f5f6fb;border-radius:19px;padding:16px 18px;font-size:clamp(22px,4vw,31px);font-weight:900}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px 74px}button.act{border:0;border-radius:15px;padding:12px 14px;color:#fff;font-weight:900;font-size:15px}.listen{background:var(--p)}.slow{background:var(--o)}.hint{background:#7785a3}.answer{background:#f8fbff;border:2px dashed #ccd8e9;border-radius:20px;padding:17px}.reveal{width:100%;border:0;border-radius:17px;padding:15px;background:linear-gradient(135deg,#ff9f43,#ff6fae);color:#fff;font-size:17px;font-weight:900}.model{display:none;background:#fff7df;border-radius:16px;padding:14px;margin-top:12px}.model.show{display:block}.eng{font-size:25px;font-weight:950}.next{display:none;width:100%;margin-top:14px;background:linear-gradient(135deg,#2fcf93,#28b8b0)!important}.next.show{display:block}.self{display:none;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.self.show{display:grid}.ok{background:var(--g)!important}.retry{background:#7b88a8!important}.talk{display:none}.talk.show{display:block}.turn{display:flex;gap:9px;margin:11px 0;align-items:flex-start}.turn.you{flex-direction:row-reverse}.mini{width:40px;height:40px;border-radius:13px;font-size:21px}.turn.you .mini{background:#dff7ff}.tb{max-width:82%;background:#f5f6fb;padding:11px 13px;border-radius:15px;font-size:18px;font-weight:850}.turn.you .tb{background:#e8fff5}.ask{background:#e9f4ff;padding:15px;border-radius:17px;margin-top:15px}.progress{height:11px;background:#e8ecf5;border-radius:99px;overflow:hidden;margin:12px 0 17px}.bar{height:100%;width:0;background:var(--g)}@media(max-width:700px){.grid{grid-template-columns:1fr}.side{display:none}.buttons{margin-left:0}.xp{font-size:13px}.nav{gap:6px}.lv{font-size:12px;padding:11px 5px}}</style></head><body><div class="app"><div class="top"><div class="brand"><div class="logo">🎧</div><div><h1>English Talk Quest</h1><div class="sub">聞く → 答える → 会話する → 質問する</div></div></div><div class="xp">⭐ <span id="xp">0</span> XP</div></div><div class="nav"><button id="b1" class="lv active" onclick="setLevel(1)">LEVEL 1<br><span class="small">答える</span></button><button id="b2" class="lv" onclick="setLevel(2)">LEVEL 2<br><span class="small">会話する</span></button><button id="b3" class="lv" onclick="setLevel(3)">LEVEL 3<br><span class="small">質問する</span></button></div><div class="links"><a class="link" href="phrases.html">📚 フレーズ一覧</a></div><div class="progress"><div id="bar" class="bar"></div></div><div class="grid"><aside class="side"><strong>🗺️ カテゴリー</strong><div id="stages"></div></aside><main class="main"><div id="level1"><span id="tag" class="tag"></span><div class="teacher"><div class="avatar">👩‍🏫</div><div><div class="small">Teacher</div><div id="question" class="bubble"></div></div></div><div class="buttons"><button class="act listen" onclick="speakQ()">🔊 聞く</button><button class="act slow" onclick="speakQ(.72)">🐢 ゆっくり</button><button class="act hint" onclick="hint()">💡 ヒント</button></div><section class="answer"><strong>英語で答えてみよう</strong><div class="small" style="margin:5px 0 12px">声に出してから答えを確認しよう。</div><button id="reveal" class="reveal" onclick="reveal()">👀 答えを見る</button><div id="model" class="model"><div class="small">答えの例</div><div id="answer" class="eng"></div><div id="jp" class="small" style="margin-top:5px"></div><button class="act listen" style="margin-top:10px" onclick="speakA()">🔊 お手本</button></div><div id="self" class="self"><button class="act ok" onclick="mark(true)">😊 言えた！</button><button class="act retry" onclick="mark(false)">🔁 もう一回</button></div></section><button id="next" class="act next" onclick="nextQ()">次へ ➜</button></div><div id="talk" class="talk"></div></main></div></div><script>const S=[{i:'😊',n:'あいさつ',q:[['Hello!','Hello!','こんにちは！'],['Good morning!','Good morning!','おはよう！'],['How are you?','I\'m great!','元気だよ！'],['Nice to meet you.','Nice to meet you, too.','こちらこそ、よろしく！'],['How is your day?','It\'s good!','いい一日だよ！'],['Are you ready?','Yes, I\'m ready!','準備できたよ！'],['How are you today?','I\'m fine, thank you.','元気です。'],['See you tomorrow!','See you!','またね！'],['Have a nice day!','Thank you! You too.','ありがとう！あなたもね。'],['Goodbye!','Bye!','バイバイ！']]},{i:'🏫',n:'学校',q:[['Do you like school?','Yes, I do.','学校は好き？'],['What subject do you like?','I like math.','好きな教科は？'],['Do you like English?','Yes, I do!','英語は好き？'],['What do you study today?','I study science.','今日は何を勉強する？'],['Do you have homework?','Yes, I do.','宿題ある？'],['Is math easy?','Yes, it is.','算数は簡単？'],['Is English difficult?','A little.','英語は難しい？'],['Who is your teacher?','My teacher is Ms. Sato.','先生は誰？'],['Do you read books?','Yes, I do.','本を読む？'],['Is school fun?','Yes, it\'s fun!','学校は楽しい？']]},{i:'🏀',n:'スポーツ',q:[['What sport do you like?','I like basketball.','好きなスポーツは？'],['Can you play basketball?','Yes, I can!','バスケできる？'],['Do you practice every day?','Yes, I do.','毎日練習する？'],['Can you run fast?','Yes, I can.','速く走れる？'],['Do you like soccer?','Yes, I do.','サッカー好き？'],['What is your favorite sport?','Basketball is my favorite.','一番好きなスポーツは？'],['Do you play with your friends?','Yes, I do.','友だちとする？'],['Was the game fun?','Yes, it was!','試合は楽しかった？'],['Did you win?','Yes, we did!','勝った？'],['Do you want to play?','Yes! Let\'s play!','やりたい？']]},{i:'🍕',n:'食べ物',q:[['What food do you like?','I like pizza.','好きな食べ物は？'],['Are you hungry?','Yes, I am.','お腹すいた？'],['What do you want to eat?','I want to eat sushi.','何を食べたい？'],['Do you like chicken?','Yes, I do.','チキン好き？'],['Do you like vegetables?','A little.','野菜好き？'],['What is your favorite fruit?','I like strawberries.','好きな果物は？'],['Is it delicious?','Yes, it\'s delicious!','おいしい？'],['Do you eat breakfast?','Yes, I do.','朝ごはん食べる？'],['What did you eat today?','I ate rice.','今日は何食べた？'],['Are you thirsty?','Yes, I am.','のどかわいた？']]},{i:'👨‍👩‍👧',n:'家族',q:[['Do you have a sister?','Yes, I do.','姉妹いる？'],['Do you have a brother?','No, I don\'t.','兄弟いる？'],['How many people are in your family?','There are four people.','何人家族？'],['Do you have a pet?','No, I don\'t.','ペットいる？'],['Does your family like sports?','Yes, we do.','家族はスポーツ好き？'],['Who cooks dinner?','My mother does.','誰が夕食を作る？'],['Do you play with your family?','Yes, I do.','家族と遊ぶ？'],['Is your family funny?','Yes, very funny!','家族は面白い？'],['Do you watch TV together?','Yes, we do.','一緒にテレビ見る？'],['Do you love your family?','Yes, I do!','家族が大好き？']]},{i:'🎮',n:'好きなこと',q:[['What do you like to do?','I like playing games.','何をするのが好き？'],['Do you like drawing?','Yes, I do.','絵は好き？'],['Do you watch YouTube?','Yes, I do.','YouTube見る？'],['What game do you like?','I like puzzle games.','何のゲームが好き？'],['Do you like music?','Yes, I do.','音楽好き？'],['Can you sing?','A little.','歌える？'],['Do you like dancing?','Yes, I do.','ダンス好き？'],['What is your hobby?','My hobby is drawing.','趣味は？'],['Do you read manga?','Yes, I do.','漫画読む？'],['Is it fun?','Yes, it\'s really fun!','楽しい？']]},{i:'🌤️',n:'天気',q:[['How is the weather?','It\'s sunny.','天気はどう？'],['Is it hot today?','Yes, it is.','今日は暑い？'],['Is it raining?','No, it isn\'t.','雨？'],['Do you like sunny days?','Yes, I do.','晴れの日好き？'],['Do you like snow?','Yes, I do.','雪好き？'],['Is it cold outside?','Yes, it is.','外は寒い？'],['What weather do you like?','I like sunny weather.','どんな天気が好き？'],['Do you need an umbrella?','Yes, I do.','傘いる？'],['Is it windy?','A little.','風強い？'],['Is the weather nice?','Yes, it is!','いい天気？']]},{i:'⏰',n:'毎日のこと',q:[['What time do you get up?','I get up at six thirty.','何時に起きる？'],['Do you eat breakfast?','Yes, I do.','朝ごはん食べる？'],['What time do you go to school?','I go at eight.','何時に学校へ？'],['What do you do after school?','I play basketball.','放課後何する？'],['Do you do your homework?','Yes, I do.','宿題する？'],['What time do you eat dinner?','I eat at seven.','何時に夕食？'],['Do you take a bath?','Yes, I do.','お風呂入る？'],['What time do you go to bed?','I go to bed at ten.','何時に寝る？'],['Are you sleepy?','A little.','眠い？'],['Was your day fun?','Yes, it was!','今日は楽しかった？']]},{i:'💬',n:'リアクション',q:[['I got a new game!','Really? That\'s cool!','新しいゲーム買った！'],['I won the game!','That\'s amazing!','試合に勝った！'],['I\'m tired.','Are you okay?','疲れた。'],['I\'m hungry.','Me too!','お腹すいた。'],['I like cats.','Me too!','猫が好き。'],['This is difficult.','You can do it!','難しい。'],['I made this.','Wow! Nice!','これ作ったよ。'],['I don\'t know.','That\'s okay.','わからない。'],['I\'m excited!','Me too!','ワクワクする！'],['Thank you!','You\'re welcome!','ありがとう！']]},{i:'🌟',n:'チャレンジ',q:[['What did you do today?','I played basketball.','今日は何した？'],['What do you want to do tomorrow?','I want to play with my friends.','明日何したい？'],['What is your favorite food?','My favorite food is sushi.','好きな食べ物は？'],['Why do you like basketball?','Because it\'s fun.','なぜバスケが好き？'],['What are you good at?','I\'m good at running.','何が得意？'],['What do you want to be?','I want to be a teacher.','何になりたい？'],['What makes you happy?','Playing basketball makes me happy.','何をすると嬉しい？'],['What did you learn today?','I learned English.','今日は何を学んだ？'],['What do you want to try?','I want to try cooking.','何に挑戦したい？'],['How was your day?','It was great!','今日はどうだった？']]}];const T=[{c:[['T','Hello!'],['Y','Hello!'],['T','How are you today?'],['Y','I\'m great!'],['T','Are you ready?'],['Y','Yes, I\'m ready!']],a:'How are you today?',j:'今日は元気ですか？'},{c:[['T','Hello!'],['Y','Hello!'],['T','Do you like school?'],['Y','Yes, I do.'],['T','What subject do you like?'],['Y','I like math.']],a:'What subject do you like?',j:'好きな教科は何ですか？'},{c:[['T','What sport do you like?'],['Y','I like basketball.'],['T','Can you play basketball?'],['Y','Yes, I can!'],['T','Do you practice every day?'],['Y','Yes, I do.']],a:'What sport do you like?',j:'どんなスポーツが好きですか？'},{c:[['T','Are you hungry?'],['Y','Yes, I am.'],['T','What food do you like?'],['Y','I like pizza.'],['T','Is it delicious?'],['Y','Yes, it is!']],a:'What food do you like?',j:'どんな食べ物が好きですか？'},{c:[['T','Do you have a sister?'],['Y','Yes, I do.'],['T','How many people are in your family?'],['Y','There are four people.'],['T','Do you have a pet?'],['Y','No, I don\'t.']],a:'Do you have a pet?',j:'ペットを飼っていますか？'},{c:[['T','What do you like to do?'],['Y','I like playing games.'],['T','Do you like music?'],['Y','Yes, I do.'],['T','What is your hobby?'],['Y','My hobby is drawing.']],a:'What do you like to do?',j:'何をするのが好きですか？'},{c:[['T','Hello!'],['Y','Hello!'],['T','How is the weather today?'],['Y','It\'s sunny today.'],['T','Is it hot today?'],['Y','Yes, it is.']],a:'How is the weather there?',j:'あなたのところの天気はどうですか？'},{c:[['T','What time do you get up?'],['Y','I get up at six thirty.'],['T','Do you eat breakfast?'],['Y','Yes, I do.'],['T','What time do you go to school?'],['Y','I go at eight.']],a:'What time do you get up?',j:'何時に起きますか？'},{c:[['T','I got a new game!'],['Y','Really? That\'s cool!'],['T','I won the game!'],['Y','That\'s amazing!'],['T','I\'m tired.'],['Y','Are you okay?']],a:'Are you okay?',j:'大丈夫ですか？'},{c:[['T','What did you do today?'],['Y','I played basketball.'],['T','Was it fun?'],['Y','Yes, it was!'],['T','What do you want to do tomorrow?'],['Y','I want to play with my friends.']],a:'What did you do today?',j:'今日は何をしましたか？'}];let st=0,ix=0,lv=1,xp=0,done=0,marked=false;function build(){let h='';S.forEach((s,i)=>h+=`<button class="stage ${i===st?'active':''}" onclick="goStage(${i})">${s.i} ${s.n}</button>`);document.getElementById('stages').innerHTML=h}function goStage(i){st=i;ix=0;render();if(lv>1)renderTalk()}function setLevel(n){lv=n;[1,2,3].forEach(x=>document.getElementById('b'+x).classList.toggle('active',x===n));document.getElementById('level1').style.display=n===1?'block':'none';document.getElementById('talk').classList.toggle('show',n>1);if(n>1)renderTalk()}function render(){const s=S[st],q=s.q[ix];tag.textContent=s.i+' '+s.n;question.textContent=q[0];answer.textContent=q[1];jp.textContent=q[2];model.className='model';self.className='self';next.className='act next';reveal.style.display='block';marked=false;build()}function reveal(){model.classList.add('show');self.classList.add('show');next.classList.add('show');document.getElementById('reveal').style.display='none'}function mark(g){if(marked)return;marked=true;done=Math.min(10,done+1);if(g){xp+=10;document.getElementById('xp').textContent=xp}bar.style.width=(done*10)+'%'}function nextQ(){if(!marked){done=Math.min(10,done+1);bar.style.width=(done*10)+'%'}ix++;if(ix>=10){ix=0;st=(st+1)%S.length;done=0}render()}function hint(){alert('💡 '+S[st].q[ix][2])}function speak(t,r=.9){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();speechSynthesis.resume();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=r;speechSynthesis.speak(u)}function speakQ(r=.9){speak(S[st].q[ix][0],r)}function speakA(){speak(S[st].q[ix][1],.86)}function renderTalk(){const t=T[st];let h=`<span class="tag">${S[st].i} ${S[st].n}</span><h2>${lv===2?'会話をつなげよう':'自分から質問しよう'}</h2><div class="small">${lv===2?'覚えたフレーズを会話の流れで使おう。':'答えたあと、先生にも質問を返そう。'}</div>`;t.c.forEach(x=>{const y=x[0]==='Y';h+=`<div class="turn ${y?'you':''}"><div class="mini">${y?'🙂':'👩‍🏫'}</div><div class="tb">${x[1]}</div></div>`});if(lv===3)h+=`<div class="ask"><strong>🎯 あなたから質問！</strong><div style="margin:6px 0 10px">${t.j}</div><button class="reveal" onclick="showAsk()">👀 英語を見る</button><div id="askAns" class="model"><div class="eng">${t.a}</div><button class="act listen" style="margin-top:10px" onclick="speak(${JSON.stringify(t.a)})">🔊 聞く</button></div></div>`;h+=`<button class="act listen" style="width:100%;margin-top:14px" onclick="playTalk()">▶️ 会話を聞く</button>`;talk.innerHTML=h}function showAsk(){askAns.classList.add('show')}function playTalk(){speechSynthesis.cancel();let a=T[st].c.map(x=>x[1]),i=0;function n(){if(i>=a.length)return;let u=new SpeechSynthesisUtterance(a[i++]);u.lang='en-US';u.rate=.86;u.onend=()=>setTimeout(n,250);speechSynthesis.speak(u)}n()}render();</script></body></html>
